name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: workflows only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify the mod jar
        run: |
          set -eu
          JAR="$(ls build/libs/authmod-*.jar | head -n 1)"
          echo "Checking ${JAR}"
          jar tf "${JAR}" > jar-entries.txt
          for entry in \
            "META-INF/neoforge.mods.toml" \
            "ru/undermine/authmod/AuthMod.class" \
            "ru/undermine/authmod/AuthModClient.class" \
            "ru/undermine/authmod/net/ServerAuth.class" \
            "ru/undermine/authmod/server/AuthEnforcement.class" \
            "assets/authmod/lang/en_us.json" \
            "assets/authmod/lang/ru_ru.json"; do
            if ! grep -qx "${entry}" jar-entries.txt; then
              echo "::error::Missing ${entry} in ${JAR}"
              exit 1
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare the dev server
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nmax-players=1\nmotd=CI smoke test\n' > run/server.properties

      - name: Start the server and wait for it to load
        run: |
          set -uo pipefail
          ./gradlew runServer --no-daemon --console=plain > server-smoke.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 300); do
            if grep -q "Done (" server-smoke.log 2>/dev/null; then
              echo "Server reached the 'Done (' state"
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Gradle exited before the server was ready"
              break
            fi
            sleep 2
          done

          echo "::error::Server did not start within the timeout"
          tail -n 250 server-smoke.log || true
          exit 1

      - name: Check the log for mod loading failures
        if: always()
        run: |
          if grep -E 'Failed to load mods|Mod loading failed|Mixin apply failed|Uncaught exception|Exception in thread "main"' server-smoke.log; then
            echo "::error::Mod loading error found in the server log"
            exit 1
          fi

      - name: Stop the dev server
        if: always()
        run: |
          pkill -f serverRunVmArgs || true
          pkill -f GradleDaemon || true
          pkill -f 'runServer' || true

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle-wrapper.jar
        uses: gradle/actions/wrapper-validation@v4
